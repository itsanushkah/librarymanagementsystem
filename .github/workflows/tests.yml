name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms
          POSTGRES_DB: library_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lms" --health-interval 5s
          --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: lms
          MYSQL_DATABASE: library_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -plms" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: SQLite
        run: pytest -q
      - name: PostgreSQL
        run: pytest -q tests/test_library.py
        env:
          LMS_TEST_BACKEND: postgres
          LMS_TEST_DATABASE_URL: postgresql://lms:lms@localhost:5432/library_test
      - name: MySQL
        run: pytest -q tests/test_library.py
        env:
          LMS_TEST_BACKEND: mysql
          LMS_MYSQL_HOST: 127.0.0.1
          LMS_MYSQL_USER: root
          LMS_MYSQL_PASSWORD: lms
          LMS_MYSQL_DATABASE: library_test
