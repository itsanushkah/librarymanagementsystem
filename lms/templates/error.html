{% extends "base.html" %}
{% block title %}{{ name }}{% endblock %}
{% block content %}
<div class="login-wrap">
  <div style="text-align:center;max-width:460px">
    <div style="font-family:'Fraunces',serif;font-size:4rem;font-weight:600;color:var(--accent);line-height:1">{{ code }}</div>
    <h1 style="margin:12px 0 8px">{{ name }}</h1>
    <p class="sub" style="font-size:1rem">{% if code == 404 %}We couldn't find that page. It may have been moved or deleted.{% else %}{{ description }}{% endif %}</p>
    <p style="margin-top:20px"><a class="btn btn-primary" href="{{ url_for('books') }}">Back to the catalogue</a></p>
  </div>
</div>
{% endblock %}
