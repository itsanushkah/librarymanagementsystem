{% extends "base.html" %}
{% block title %}Register member{% endblock %}
{% block content %}
<p><a href="{{ url_for('members') }}">← Members</a></p>
<div class="page-head"><h1>Register a member</h1></div>
<form method="post" class="card card-pad form">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <div class="field"><label for="name">Full name</label><input id="name" name="name" value="{{ member.name or '' }}" required></div>
  <div class="row">
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" value="{{ member.email or '' }}" required></div>
    <div class="field"><label for="phone">Phone <span class="sub">(optional)</span></label><input id="phone" name="phone" value="{{ member.phone or '' }}"></div>
  </div>
  <button class="btn btn-primary">Register</button>
</form>
{% endblock %}
