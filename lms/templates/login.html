{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card card-pad login">
    <h1>Librarian sign in</h1>
    <p class="sub" style="margin:4px 0 20px">Sign in to manage books, members and loans.</p>
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <div class="field"><label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required autofocus></div>
      <div class="field"><label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
